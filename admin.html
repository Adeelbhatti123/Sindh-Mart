<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sindh Mart Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#202124}
header{background:#111827;color:#fff;padding:16px}.container{max-width:1050px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:8px;padding:10px 14px;background:#111827;color:#fff;font-weight:600;cursor:pointer}
button.danger{background:#dc2626}button.secondary{background:#e5e7eb;color:#111}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{font-size:26px;font-weight:bold}.muted{color:#6b7280;font-size:13px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;min-height:105px}
.product img{width:75px;height:75px;object-fit:cover;border-radius:8px;float:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container"><h2>🛒 Sindh Mart Admin</h2><div class="muted" style="color:#d1d5db">Orders & Products Management</div></div></header>

<div class="container">
<div id="loginBox" class="card">
<h3>🔐 Admin Login</h3>
<input id="pin" type="password" inputmode="numeric" placeholder="Enter Admin PIN">
<button onclick="login()">Login</button>
<p id="loginMsg" class="muted"></p>
</div>

<div id="adminApp" class="hidden">
<div class="tabs">
<button onclick="showTab('orders')">📦 Orders</button>
<button onclick="showTab('products')">🛍️ Products</button>
</div>

<section id="ordersTab">
<div class="grid">
<div class="card"><div id="pendingCount" class="stat">0</div><div class="muted">Pending</div></div>
<div class="card"><div id="confirmedCount" class="stat">0</div><div class="muted">Confirmed</div></div>
<div class="card"><div id="deliveryCount" class="stat">0</div><div class="muted">Out for Delivery</div></div>
<div class="card"><div id="deliveredCount" class="stat">0</div><div class="muted">Delivered</div></div>
</div>
<div id="ordersList"></div>
</section>

<section id="productsTab" class="hidden">
<div class="card">
<h3>➕ Add New Product</h3>
<input id="productName" placeholder="Product name">
<div class="row">
<div><label class="muted">Price</label><input id="productPrice" type="number" min="0" placeholder="Price"></div>
<div><label class="muted">Category</label><select id="productCategory"><option value="">Select category</option></select></div>
</div>
<input id="productImage" placeholder="Product image URL (optional)">
<button onclick="addProduct()">➕ Add Product</button>
<p id="productMessage" class="muted"></p>
</div>

<div class="card">
<h3>🛍️ Existing Products</h3>
<div id="productsList">Loading...</div>
</div>
</section>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,push,set,update,remove,get} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyD2J8uu4ZNIp0ubB9Opp1UinH8nJzsa1cs",
authDomain:"sindh-mart.firebaseapp.com",
databaseURL:"https://sindh-mart-default-rtdb.firebaseio.com",
projectId:"sindh-mart",
storageBucket:"sindh-mart.firebasestorage.app",
messagingSenderId:"362306587082",
appId:"1:362306587082:web:e32acf1002ab36a1106733",
measurementId:"G-TTRXHPP213"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

window.login=()=>{
if($("pin").value==="1234"){
$("loginBox").classList.add("hidden");
$("adminApp").classList.remove("hidden");
loadCategories();loadProducts();loadOrders();
}else $("loginMsg").textContent="Wrong PIN.";
};

window.showTab=tab=>{
$("ordersTab").classList.toggle("hidden",tab!=="orders");
$("productsTab").classList.toggle("hidden",tab!=="products");
};

function loadCategories(){
onValue(ref(db,"categories"),snap=>{
const data=snap.val()||{};
$("productCategory").innerHTML='<option value="">Select category</option>';
Object.entries(data).forEach(([id,c])=>{
const option=document.createElement("option");
option.value=id;
option.textContent=typeof c==="string"?c:(c.name||id);
$("productCategory").appendChild(option);
});
});
}

function loadProducts(){
onValue(ref(db,"products"),snap=>{
const data=snap.val()||{};
const box=$("productsList");box.innerHTML="";
Object.entries(data).forEach(([id,p])=>{
const available=p.available!==false;
const image=p.image||p.imageUrl||"";
const div=document.createElement("div");
div.className="product";
div.innerHTML=
(image?`<img src="${image}" onerror="this.style.display='none'">`:"")+
`<b>${escapeHtml(p.name||"Unnamed Product")}</b><br>
Price: <b>Rs. ${p.price??0}</b><br>
<span class="badge">${available?"✅ Available":"❌ Out of Stock"}</span>
<br><br>
<button onclick="editProduct('${id}')">✏️ Edit</button>
<button class="secondary" onclick="toggleStock('${id}',${available})">${available?"📦 Out of Stock":"✅ Available"}</button>
<button class="danger" onclick="deleteProduct('${id}')">🗑️ Delete</button>`;
box.appendChild(div);
});
if(!Object.keys(data).length)box.textContent="No products found.";
});
}

window.addProduct=async()=>{
const name=$("productName").value.trim();
const price=Number($("productPrice").value);
const category=$("productCategory").value;
const image=$("productImage").value.trim();
if(!name||price<=0||!category){
$("productMessage").textContent="Name, price and category are required.";
return;
}
await set(push(ref(db,"products")),{name,price,category,image,available:true});
$("productName").value="";$("productPrice").value="";$("productImage").value="";$("productCategory").value="";
$("productMessage").textContent="✅ Product added successfully.";
};

window.editProduct=async id=>{
const snap=await get(ref(db,"products/"+id));const p=snap.val();if(!p)return;
const name=prompt("Product name:",p.name||"");if(name===null)return;
const price=prompt("Price:",p.price??0);if(price===null)return;
const category=prompt("Category ID:",p.category||p.categoryId||"");if(category===null)return;
const image=prompt("Image URL:",p.image||p.imageUrl||"");if(image===null)return;
await update(ref(db,"products/"+id),{name:name.trim(),price:Number(price),category:category.trim(),image:image.trim()});
alert("✅ Product updated.");
};

window.toggleStock=async(id,current)=>{
await update(ref(db,"products/"+id),{available:!current});
};

window.deleteProduct=async id=>{
if(confirm("Are you sure you want to delete this product?")){
await remove(ref(db,"products/"+id));
alert("🗑️ Product deleted.");
}
};

function loadOrders(){
onValue(ref(db,"orders"),snap=>{
const data=snap.val()||{};
const orders=Object.entries(data).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
let pending=0,confirmed=0,out=0,delivered=0;
$("ordersList").innerHTML="";
orders.forEach(([id,o])=>{
const status=o.status||"Pending";
if(status==="Pending")pending++;
if(status==="Confirmed")confirmed++;
if(status==="Out for Delivery")out++;
if(status==="Delivered")delivered++;
const c=o.customer||{};
const items=Object.values(o.items||{});
const itemHtml=items.map(i=>`${escapeHtml(i.name||"Item")} × ${i.quantity||1} — Rs. ${i.subtotal??((i.price||0)*(i.quantity||1))}`).join("<br>");
const div=document.createElement("div");div.className="card";
div.innerHTML=`<b>Order ID:</b> ${id}<br>
<b>Customer:</b> ${escapeHtml(c.name||"-")}<br>
<b>Phone:</b> ${escapeHtml(c.phone||"-")}<br>
<b>Area:</b> ${escapeHtml(c.area||"-")}<br>
<b>Address:</b> ${escapeHtml(c.address||"-")}<br><br>
<b>Items:</b><br>${itemHtml||"-"}<br><br>
<b>Total:</b> Rs. ${o.total||0}<br>
<b>Payment:</b> ${escapeHtml(o.paymentMethod||"Cash on Delivery")}<br>
<b>Status:</b>
<select onchange="changeStatus('${id}',this.value)">
${["Pending","Confirmed","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${s===status?"selected":""}>${s}</option>`).join("")}
</select>`;
$("ordersList").appendChild(div);
});
$("pendingCount").textContent=pending;
$("confirmedCount").textContent=confirmed;
$("deliveryCount").textContent=out;
$("deliveredCount").textContent=delivered;
});
}

window.changeStatus=async(id,status)=>{
await update(ref(db,"orders/"+id),{status});
};

function escapeHtml(text){
return String(text).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
